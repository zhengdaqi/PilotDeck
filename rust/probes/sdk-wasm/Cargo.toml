# ADR-0002 D3 probe: wasm-bindgen wrapper path for `@pilotdeck/sdk` (no publishing).
[package]
name = "pilotdeck-sdk-wasm-probe"
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde_json = "1"
web-sys = { version = "0.3", features = ["WebSocket", "MessageEvent", "CloseEvent", "Event"] }

[profile.release]
opt-level = "z"
lto = true

[workspace]
