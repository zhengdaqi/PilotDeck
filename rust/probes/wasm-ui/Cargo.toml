# ADR-0003 probe workspace (Wasm UI framework). Separate from the main workspace on purpose.
[workspace]
resolver = "3"
members = ["shared", "leptos-app", "dioxus-app", "yew-app"]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
publish = false

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
