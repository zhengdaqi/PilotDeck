[package]
name = "pilotdeck-sdk"
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "Transport-agnostic core of the PilotDeck SDK (port of packages/sdk)."

[features]
# Native-only parts (filesystem session store). The wasm build uses default-features = false.
default = ["fs", "net"]
fs = ["dep:base64", "dep:pilotdeck-agent-loop-sidecar"]
# Native WebSocket network layer (blocking IO thread over tungstenite).
net = ["dep:tungstenite", "dep:pilotdeck-gateway-client", "dep:getrandom", "dep:url"]

[dependencies]
serde_json = { workspace = true, features = ["preserve_order"] }
base64 = { version = "0.22", optional = true }
pilotdeck-agent-loop-sidecar = { path = "../agent-loop-sidecar", optional = true }
tungstenite = { workspace = true, optional = true }
pilotdeck-gateway-client = { path = "../gateway-client", optional = true }
getrandom = { version = "0.2", optional = true }
url = { version = "2", optional = true }
