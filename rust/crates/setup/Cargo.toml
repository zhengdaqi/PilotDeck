[package]
name = "pilotdeck-setup"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[dependencies]
pilotdeck-session-search = { path = "../session-search" }
pilotdeck-skills = { path = "../skills" }
serde_json = { workspace = true, features = ["preserve_order"] }
serde_yaml.workspace = true
regex-lite = "0.1"
yaml-rust2 = "0.9"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
