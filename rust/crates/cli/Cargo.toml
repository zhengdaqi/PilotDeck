[package]
name = "pilotdeck-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rust entry point for the pilotdeck CLI (migrated commands only)"

[[bin]]
name = "pilotdeck"
path = "src/main.rs"

[dependencies]
signal-hook = "0.3"
pilotdeck-session-search = { path = "../session-search" }
pilotdeck-skills = { path = "../skills" }
pilotdeck-gateway-client = { path = "../gateway-client" }
pilotdeck-setup = { path = "../setup" }
serde_json = { workspace = true, features = ["preserve_order"] }
serde.workspace = true
